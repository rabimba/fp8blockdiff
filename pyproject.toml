[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fp8blockdiff"
version = "0.1.0"
description = "FP8 Block-Diffusion Speculative Decoding on Cloud TPU v7 (Ironwood / v7x) Systolic Arrays"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rabimba Karanjai" }
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "aiohttp>=3.9.0",
  "huggingface-hub>=0.25.0",
  "datasets>=2.20.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.2",
  "pytest>=8.0.0",
]

[project.optional-dependencies]
tpu = [
  # Installed / verified on Cloud TPU v7 VM via official TorchTPU & OpenXLA indices
  "torch>=2.6.0",
  "vllm-torchtpu",
  "jax[tpu]>=0.4.35",
  "tpu-info",
  "xprof",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "kernels*", "benchmarks*"]

[project.entry-points."vllm.general_plugins"]
fp8blockdiff_pallas = "src.spec_decode.vllm_pallas_plugin:register_pallas_adaptive_verifier"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "tpu_required: requires a live Cloud TPU v7 device (never mocked on CPU)",
  "host_only: deterministic math, roofline, and binary protobuf parser verification runnable without TPU",
]
